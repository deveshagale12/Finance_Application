spring.application.name=Finance_Application





#========================================


# Database Connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Logging
# =========================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG



# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ensure Spring knows where to look for the uploads folder
spring.web.resources.static-locations=classpath:/static/,file:uploads/
#spring.web.resources.static-locations=file:uploads/

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=deveshagale@gmail.com
spring.mail.password=ozvzfxgbmttigzeb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# ---- Custom JWT settings (used by the separate JWT module: com.example.authdemo.jwtapi) ----
# 256-bit+ base64 secret. CHANGE THIS IN PRODUCTION and load from env/secret manager.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_EXPIRATION}
# 1 hour
jwt.refresh-token-expiration-ms=${JWT_REFRESH}
# 7 days
jwt.issuer=${JWT_ISSUER}
 
# ---- API key settings ----
# Comma-separated list of valid API keys. In production, store per-client keys in the DB.

api.security.valid-keys=${API_SECURITY_VALID_KEYS:demo-api-key-12345,partner-api-key-67890}
api.security.header-name=${API_HEADER:X-API-KEY}
 